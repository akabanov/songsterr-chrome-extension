name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Zip extension
        run: |
          cd dist
          zip -r "../songsterr-downloader-${{ github.ref_name }}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: songsterr-downloader-${{ github.ref_name }}.zip
          generate_release_notes: true
