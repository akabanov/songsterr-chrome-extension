name: Dev Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Zip extension
        run: |
          cd dist
          zip -r ../songsterr-chrome-extension-dev.zip .

      - name: Move dev tag to latest commit
        run: |
          git tag -f dev
          git push origin dev --force

      - name: Update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build (latest main)
          prerelease: true
          body: |
            Automatically rebuilt from the latest commit on `main` (${{ github.sha }}).
            This is the bleeding-edge build — it may be unstable. For a stable version, see the [latest release](../../releases/latest).
          files: songsterr-chrome-extension-dev.zip
